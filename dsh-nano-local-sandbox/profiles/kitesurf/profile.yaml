id: kitesurf
version: 1
platform:
  - darwin/arm64
backend: apple-container
scope: session
build:
  base: node:22-bookworm-slim
  image: kitesurf-engine:39feadfb9a3e6c14b40cf170a559ce417d0fce5d-472144145d78
  npmPrefix:
    wrangler: 4.131.2
    agent-browser: 0.42.0
  checkout:
    ref: 39feadfb9a3e6c14b40cf170a559ce417d0fce5d
    verify: packages/engine/wrangler.jsonc
  digest: sha256:472144145d78032f0ef3a00d29b6fc36eb38335f62e1b94fe28ec0005223d9c1
runtime:
  user: node
  entrypoint: /entrypoint.sh
  services:
    - id: engine
      port: 8787
      command: wrangler dev --env local -c wrangler.jsonc --persist-to volume
    - id: mcp-bridge
      port: 8791
      command: node /mcp-bridge.mjs
  state:
    kv: volume
  isolation:
    network: loopback-only
    resources:
      cpus: 4
      memory: 4G
lifecycle:
  idleTimeoutMs: 1800000
  maxInstances: 2
policyMapping:
  read-only:
    checkout: ro
    state: ephemeral
    network: deny
  workspace-write:
    checkout: ro
    state: rw
    workspace: rw
    extraRoots: rw
  danger-full-access:
    checkout: ro
    state: rw
    note: container-only
capabilities:
  drivers:
    - cdp
    - mcp
  tools:
    - sandbox.instance.ensure
health:
  engine: kitesurf
  bridge: ok
  selftest: 11
