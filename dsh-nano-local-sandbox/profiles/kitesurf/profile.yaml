id: kitesurf
version: 1
platform:
  - darwin/arm64
backend: apple-container
scope: session
driver: ./driver/index.js
build:
  base: node:22-bookworm-slim
  image: kitesurf-engine:39feadfb9a3e6c14b40cf170a559ce417d0fce5d-30194a9dd85c
  recipe:
    - Dockerfile
    - entrypoint.sh
    - mcp-bridge.mjs
  npmPrefix:
    wrangler: 4.131.2
    agent-browser: 0.42.0
  checkout:
    ref: 39feadfb9a3e6c14b40cf170a559ce417d0fce5d
    verify: packages/engine/wrangler.jsonc
  digest: sha256:30194a9dd85c4b1332c4973b6b19b6388f36e1425b4d2043ddad5ff2b5bf2ee5
runtime:
  user: node
  entrypoint: /entrypoint.sh
  services:
    - id: engine
      port: 8787
      command: wrangler dev --env local -c wrangler.jsonc --persist-to volume
    - id: mcp-bridge
      port: 8791
      command: node /mcp-bridge.mjs
  state:
    kv: volume
  isolation:
    network: loopback-only
    resources:
      cpus: 4
      memory: 4G
instance:
  name: kitesurf
  ports:
    engine: 8787
    bridge: 8791
  hostPorts:
    prod:
      engine: 8798
      bridge: 8799
    dev:
      engine: 8800
      bridge: 8801
    desktop:
      engine: 8802
      bridge: 8803
lifecycle:
  idleTimeoutMs: 1800000
  maxInstances: 2
policyMapping:
  read-only:
    checkout: ro
    state: ephemeral
    network: deny
  workspace-write:
    checkout: ro
    state: rw
    workspace: rw
    extraRoots: rw
  danger-full-access:
    checkout: ro
    state: rw
    note: container-only
capabilities:
  drivers:
    - cdp
    - mcp
  tools:
    - sandbox.instance.ensure
health:
  engine: kitesurf
  bridge: ok
  selftest: 11
