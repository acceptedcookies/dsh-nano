[package]
name = "dnt-core"
version = "0.1.0"
edition = "2021"
description = "dsh-nano-terminal WASM VT core: parser + grid + render ops"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vte = "0.15"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
